# Local dev infrastructure only — production topology lives in spec-14.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: teoripro
      POSTGRES_PASSWORD: teoripro
      POSTGRES_DB: teoripro
    ports:
      - "5544:5432" # host 5544: avoids clashing with a host-level postgres on 5432
    volumes:
      - teoripro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teoripro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - teoripro_redisdata:/data

volumes:
  teoripro_pgdata:
  teoripro_redisdata:
