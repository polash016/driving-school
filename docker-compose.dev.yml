# Local dev infrastructure only — production topology lives in spec-14.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: teoripro
      POSTGRES_PASSWORD: teoripro
      POSTGRES_DB: teoripro
    ports:
      - "5544:5432" # host 5544: avoids clashing with a host-level postgres on 5432
    volumes:
      - teoripro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teoripro"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
    volumes:
      - teoripro_redisdata:/data

  # Dev mail sink (spec-03): SMTP on 1025, web inbox on http://localhost:8025.
  # Production SMTP credentials are a spec-14 concern.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  teoripro_pgdata:
  teoripro_redisdata:
